# Firebase App Hosting configuration (prepared, NOT deployed). See docs/DEPLOYMENT.md.
# Secrets are referenced by name and created with `firebase apphosting:secrets:set` - never typed here.
runConfig:
  cpu: 1
  memoryMiB: 1024
  minInstances: 0
  maxInstances: 4
  concurrency: 80

env:
  - variable: APP_ENV
    value: production
  - variable: INTEGRATION_MODE
    value: live
  - variable: NEXT_PUBLIC_INTEGRATION_MODE
    value: live
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_USE_EMULATORS
    value: "false"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://REPLACE-WITH-DOMAIN
    availability: [BUILD, RUNTIME]
  # Public Firebase web config (identifiers, not secrets). Fill from the Firebase console.
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: REPLACE
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: REPLACE
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: REPLACE
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: REPLACE
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: REPLACE
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_RAZORPAY_KEY_ID
    value: REPLACE
    availability: [BUILD, RUNTIME]
  - variable: RAZORPAY_KEY_ID
    value: REPLACE
    availability: [RUNTIME]
  # Secrets (Cloud Secret Manager names)
  - variable: RAZORPAY_KEY_SECRET
    secret: razorpay-key-secret
  - variable: RAZORPAY_WEBHOOK_SECRET
    secret: razorpay-webhook-secret
  - variable: SHIPROCKET_EMAIL
    secret: shiprocket-email
  - variable: SHIPROCKET_PASSWORD
    secret: shiprocket-password
  - variable: SHIPROCKET_WEBHOOK_TOKEN
    secret: shiprocket-webhook-token
  - variable: ANTHROPIC_API_KEY
    secret: anthropic-api-key
  - variable: JOB_SECRET
    secret: job-secret
  - variable: ORDER_TOKEN_SECRET
    secret: order-token-secret
